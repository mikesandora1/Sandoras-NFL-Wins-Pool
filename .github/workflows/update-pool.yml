name: Update NFL pool data
on:
  workflow_dispatch:
  schedule:
    # Frequent refreshes on NFL game days during the regular season.
    # Generated data only commits when something actually changes.
    - cron: "*/15 * * 9-12 0,1,4"
    # Tuesday safety/finalization refresh.
    - cron: "30 13 * 9-12 2"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node automation/update-data.mjs
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/current.json
          git diff --cached --quiet || git commit -m "Update NFL pool data"
          git push
