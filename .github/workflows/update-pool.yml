name: Update NFL pool data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * 9-12,1 0,1,4"
    - cron: "30 13 * 9-12,1 2"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check generator syntax
        run: node --check automation/update-data.mjs
      - run: node automation/update-data.mjs
      - name: Validate known Week 3 baseline
        run: node automation/validate-week3.mjs
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/current.json
          git diff --cached --quiet || git commit -m "Update NFL pool data"
          git push
