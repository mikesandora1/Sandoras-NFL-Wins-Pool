name: Update NFL pool data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/update-pool.yml"
  schedule:
    # Daily morning refresh during the NFL regular season (12:30 UTC = 8:30 EDT / 7:30 EST)
    - cron: "30 12 * 9-12,1 *"

    # Sunday game window: roughly noon through 1:00 a.m. ET
    - cron: "7,22,37,52 16-23 * 9-12,1 0"
    - cron: "7,22,37,52 0-5 * 9-12,1 1"

    # Monday Night Football window
    - cron: "7,22,37,52 23 * 9-12,1 1"
    - cron: "7,22,37,52 0-5 * 9-12,1 2"

    # Thursday Night Football window
    - cron: "7,22,37,52 23 * 9-12,1 4"
    - cron: "7,22,37,52 0-5 * 9-12,1 5"

    # Late-season Saturday games (December and January)
    - cron: "7,22,37,52 16-23 * 12,1 6"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check generator syntax
        run: node --check automation/update-data.mjs
      - run: node automation/update-data.mjs
      - name: Validate known Week 3 baseline
        run: node automation/validate-week3.mjs
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/current.json
          git diff --cached --quiet || git commit -m "Update NFL pool data"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy updated pool site
        id: deployment
        uses: actions/deploy-pages@v4
